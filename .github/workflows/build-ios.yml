name: Build iOS (unsigned, simulator)

# Manual only: macOS runners are expensive. Produces an unsigned simulator build of the
# Kotlin Multiplatform shell in iosApp/. A device build / IPA needs an Apple developer
# team (set TEAM_ID in iosApp/Configuration/Config.xcconfig) and is not done here.
on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Checkout Tubular-Extractor-Revived
        uses: actions/checkout@v6
        with:
          repository: feuerswut/Tubular-Extractor-Revived
          path: Tubular-Extractor-Revived

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: "temurin"
          cache: 'gradle'

      - name: Link iOS framework (simulator)
        run: ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64 --stacktrace -DskipFormatKtlint

      - name: Build iosApp for simulator without signing
        run: |
          xcodebuild build \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath out/ios \
            CODE_SIGNING_ALLOWED=NO

      - name: Zip app
        run: ditto -c -k --sequesterRsrc --keepParent out/ios/Build/Products/Debug-iphonesimulator/*.app tubular-ios-simulator.zip

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: ios-simulator-app
          path: tubular-ios-simulator.zip
