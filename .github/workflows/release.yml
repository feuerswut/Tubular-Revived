name: Release

on:
  workflow_dispatch:
    inputs:
      title:
        type: string
        description: 'Title'
        required: true
        default: 'v0.00.0'
      is_pre_release:
        type: boolean
        description: 'Set as a pre-release'
        required: true
        default: true
      extractor_ref:
        type: string
        description: 'Branch or tag of Tubular-Extractor-Revived to build against'
        required: true
        default: 'main'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    
    permissions: write-all

    steps:
      - name: Checkout branch "${{ github.ref_name }}"
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Checkout Tubular-Extractor-Revived
        uses: actions/checkout@v4
        with:
          repository: feuerswut/Tubular-Extractor-Revived
          ref: ${{ inputs.extractor_ref }}
          path: Tubular-Extractor-Revived

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: "temurin"
          cache: 'gradle'

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Sign APK
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: |
          version=$(grep 'NEWPIPE_VERSION_NAME[[:space:]]*=' buildSrc/src/main/kotlin/ProjectConfig.kt | grep -o '"[^"]*"' | head -n 1 | tr -d '"')
          [ -n "$version" ] || { echo "Could not read the version name"; exit 1; }
          echo "${KEYSTORE}" | base64 -d > apksign.keystore
          # newest installed build-tools, instead of a hard-coded version that may be removed
          BUILD_TOOLS=$(ls "${ANDROID_HOME}/build-tools" | sort -V | tail -n 1)
          "${ANDROID_HOME}/build-tools/${BUILD_TOOLS}/apksigner" sign --ks apksign.keystore --ks-pass env:SIGNING_STORE_PASSWORD "app/build/outputs/apk/release/app-release-unsigned.apk"
          mv app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/release/"tubular_v${version}.apk"

      - name: Create release and upload
        run: |
          version=$(grep 'NEWPIPE_VERSION_NAME[[:space:]]*=' buildSrc/src/main/kotlin/ProjectConfig.kt | grep -o '"[^"]*"' | head -n 1 | tr -d '"')
          [ -n "$version" ] || { echo "Could not read the version name"; exit 1; }
          gh auth login --with-token <<<"${{ secrets.GITHUB_TOKEN }}"
          gh release create "v${version}" --title "${{ inputs.title }}" --notes-file ".github/changelog.md" --prerelease=${{ inputs.is_pre_release }} --target "${{ github.sha }}" --repo ${{ github.repository }}
          gh release upload "v${version}" app/build/outputs/apk/release/*.apk --repo ${{ github.repository }}

      - name: Archive reports for job
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: '*/build/reports'
        if: ${{ always() }}
